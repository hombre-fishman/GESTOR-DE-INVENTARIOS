<!-- ================= PANTALLA DE LOGIN / REGISTRO ================= -->
    <div id="login-view" class="flex min-h-screen items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-800 rounded-2xl border border-slate-700 p-8 shadow-2xl">
            <div class="flex flex-col items-center mb-8">
                <div class="p-3 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30 mb-4">
                    <i data-lucide="boxes" class="w-8 h-8 text-white"></i>
                </div>
                <h2 id="auth-title" class="text-2xl font-bold text-white">Bienvenido a Prostock</h2>
                <p id="auth-subtitle" class="text-slate-400 text-sm mt-1">Ingresa a tu cuenta para continuar</p>
            </div>

            <!-- Formulario de Login -->
            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                        <input type="email" id="login-email" required placeholder="tu@correo.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div id="login-error" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg text-center"></div>
                <button type="submit" id="btn-submit-login" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-all shadow-lg shadow-indigo-500/25 flex justify-center items-center gap-2">
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <!-- Formulario de Registro (Oculto por defecto) -->
            <form id="form-register" class="space-y-5 hidden">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Nuevo Correo Electrónico</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                        <input type="email" id="register-email" required placeholder="admin@prostock.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Crear Contraseña (mínimo 6 caracteres)</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="register-password" minlength="6" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div id="register-msg" class="hidden text-sm p-3 rounded-lg text-center"></div>
                <button type="submit" id="btn-submit-register" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg transition-all shadow-lg shadow-emerald-500/25 flex justify-center items-center gap-2">
                    <span>Crear Cuenta</span>
                </button>
            </form>

            <!-- Botón para alternar entre Login y Registro -->
            <div class="mt-6 text-center">
                <button id="btn-toggle-auth" type="button" class="text-sm text-slate-400 hover:text-indigo-400 transition-colors">
                    ¿No tienes cuenta? Regístrate aquí
                </button>
            </div>
        </div>
    </div>
